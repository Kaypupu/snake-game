const N = { C3:131,D3:147,E3:165,F3:175,G3:196,A3:220,B3:247,

function initAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
}

function tone(freq, dur, type, vol) {
  if (!actx) return;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'sine';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
  o.connect(g).connect(actx.destination);
  o.start();
  o.stop(actx.currentTime + dur + 0.01);
  o.onended = () => { try { g.disconnect(); } catch(e) {} };
}

const MENU_TUNE = [
  [523,0.3,'square',0.12],[659,0.3,'square',0.12],[784,0.5,'square',0.12],
  [0,0.15],[523,0.3,'square',0.12],[659,0.3,'square',0.12],[784,0.3,'square',0.12],
  [0,0.15],[880,0.2,'square',0.12],[784,0.2,'square',0.12],[659,0.4,'square',0.12],
  [523,0.3,'square',0.12],[587,0.3,'square',0.12],[659,0.5,'square',0.12],

];
const GAME_TUNE = [

  [880,0.15,'square',0.12],[784,0.15,'square',0.12],[659,0.3,'square',0.12],

  [1319,0.15,'square',0.12],[1047,0.15,'square',0.12],[880,0.3,'square',0.12],
  [784,0.15,'square',0.12],[988,0.15,'square',0.12],[1175,0.15,'square',0.12],[1568,0.15,'square',0.12],

];
const GAMEOVER_TUNE = [
  [440,0.25,'square',0.12],[330,0.2,'square',0.12],[262,0.2,'square',0.12],
  [0,0.06],[294,0.25,'square',0.12],[349,0.2,'square',0.12],[330,0.25,'square',0.12],

];

let _tuneGen = 0;

function playTune(tune, loop) {
  const gen = ++_tuneGen;
  let idx = 0;
  function next() {
    if (gen !== _tuneGen) return;
    try {
      if (idx >= tune.length) {
        if (loop) { idx = 0; }
        else { stopBgm(); return; }
      }
      const [freq, dur, type, vol] = tune[idx];
      if (freq > 0) tone(freq, dur, type, vol);
      const wait = Math.max(dur * 1000, 50);
      idx++;
      bgmTimer = setTimeout(next, wait);
    } catch(e) {
      idx++;
      if (gen === _tuneGen && (idx < tune.length || loop)) {
        bgmTimer = setTimeout(next, 50);
      }
    }
  }
  next();
}

function stopBgm() {
  try {
    if (bgmTimer) { clearTimeout(bgmTimer); bgmTimer = null; }
    _tuneGen++;
    bgmType = '';
  } catch(e) {}
}

function startBgm(type) {
  stopBgm();
  if (!actx) return;
  function _doStart() {
    bgmType = type;
    const tune = type === 'menu' ? MENU_TUNE : GAME_TUNE;
    playTune(tune, true);
  }
  if (actx.state === 'running') _doStart();
  else actx.resume().then(_doStart).catch(() => {});
}

let _goTimer = null;
function startGameOverBgm() {
  if (_goTimer) { clearTimeout(_goTimer); _goTimer = null; }
  stopBgm();
  if (!actx) return;
  function _doStart() {
    bgmType = 'gameover';
    let i = 0;
    function next() {
      if (bgmType !== 'gameover') return; // 被取消则停止
      if (i >= GAMEOVER_TUNE.length) { stopBgm(); return; }
      const [freq, dur, type, vol] = GAMEOVER_TUNE[i];
      if (freq > 0) tone(freq, dur, type, vol);
      i++;
      _goTimer = setTimeout(next, Math.max(dur * 1000, 50));
    }
    next();
  }
  if (actx.state === 'running') _doStart();
  else actx.resume().then(_doStart).catch(() => {});
}

  g.gain.setValueAtTime(0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.25);
  o.connect(g).connect(actx.destination);
  o.start(t);o.stop(t+0.3);
}

}

function sfxMagnet(){ if(!actx)return;var t=actx.currentTime;

// ═══════════════ 响应式 ═══════════════
function resize() {
  const max = Math.min(CANVAS_MAX, window.innerWidth * 0.95, window.innerHeight - 200);
  CELL_SIZE = Math.floor(max / CELL_COUNT);
  W = CELL_SIZE * CELL_COUNT;
  cv.width = W; cv.height = W;
}
resize(); window.addEventListener('resize', resize);

// ═══════════════ 游戏状态 ═══════════════
const ST = { MENU: 'menu', PLAYING: 'playing', SHOP: 'shop' };
let state = ST.MENU;
let snake, dir, nextDir, food, score, gameOver, paused;
let menuFrame = 0, btnRect = null, btnHover = false, shopBtnRect = null, btnHoverShop = false;

// ═══════════════ 金币 & 商店 ═══════════════
let totalCoins = 0;

const SHOP_ITEMS = [
  { id:'shield', name:'屏障', desc:'抵挡一次撞击伤害', cost:50, icon:'🛡️', max:3 },
  { id:'double',   name:'双倍积分', desc:'10秒内积分与金币翻倍', cost:40, icon:'✨', max:5 },
  { id:'slow',     name:'减速', desc:'10秒内速度减半', cost:35, icon:'🐢', max:5 },
  { id:'magnet',   name:'磁铁', desc:'10秒内食物自动靠近', cost:45, icon:'🧲', max:3 },
];

// 持有的道具数量
let inventory = JSON.parse(localStorage.getItem('snake_inv') || '{}');
for (const item of SHOP_ITEMS) {
  if (!(item.id in inventory)) inventory[item.id] = 0;
}

// 当前激活的能力（可叠加）
let activePowers = {};      // { shield: endTime, double: endTime, ... }
let invincibleUntil = 0;
let blinkOn = false;
let effects = [];
let _effectTick = 0;

function spawnEffect(x, y, color, count) {
  for (let i=0;i<count;i++) {
    effects.push({x:x+(Math.random()-0.5)*CELL_SIZE*1.5, y:y+(Math.random()-0.5)*CELL_SIZE*1.5, color:color, life:1, vy:-(Math.random()*3+2), vx:(Math.random()-0.5)*3});
  }
}
function updateEffects() {
  effects = effects.filter(e => { e.life-=0.10; e.y+=e.vy*0.8; e.x+=e.vx*0.6; return e.life>0; });
  effects.forEach(e => {
    ctx.globalAlpha = e.life;
    ctx.fillStyle = e.color;
    var s = 4 + (1-e.life)*4;
    ctx.fillRect(e.x-s/2, e.y-s/2, s, s);
  });
  ctx.globalAlpha = 1;
}

function hasPower(id) { return !!activePowers[id] && Date.now() < activePowers[id]; }
function anyPower() { return Object.keys(activePowers).some(id => hasPower(id)); }

function saveData() {
  localStorage.setItem('snake_coins', totalCoins);
  localStorage.setItem('snake_inv', JSON.stringify(inventory));
}

function buyItem(itemId) {
  const item = SHOP_ITEMS.find(i => i.id === itemId);
  if (!item) return false;
  if (totalCoins < item.cost) { sfxError(); return false; }
  if (inventory[itemId] >= item.max) { sfxError(); return false; }
  totalCoins -= item.cost;
  inventory[itemId]++;
  saveData();
  sfxBuy();
  updatePowerCounts();
  return true;
}

function usePower(itemId) {
  console.log('usePower called:', itemId, 'inv:', inventory[itemId]);
  if (!inventory[itemId] || inventory[itemId] <= 0) { sfxError(); return false; }
  const item = SHOP_ITEMS.find(i => i.id === itemId);
  inventory[itemId]--;
  saveData();
  // 使用道具：设置/重置 10 秒计时
  activePowers[itemId] = itemId === 'shield' ? Date.now() + 999999999 : Date.now() + 10000;
  // 道具特效（大爆发）+ 独立音效
  if (snake && snake[0]) {
    var sx = snake[0].x*CELL_SIZE+CELL_SIZE/2, sy = snake[0].y*CELL_SIZE+CELL_SIZE/2;
    if (itemId === 'shield') { sfxShield(); spawnEffect(sx, sy, '#ffb040', 30); spawnEffect(sx, sy, '#ff8018', 20); }
    else if (itemId === 'double') { sfxDouble(); spawnEffect(sx, sy, '#fff880', 35); spawnEffect(sx, sy, '#ffffc0', 25); }
    else if (itemId === 'slow') { sfxSlow(); spawnEffect(sx, sy, '#a0d8ff', 28); spawnEffect(sx, sy, '#60b0ff', 20); }
    else if (itemId === 'magnet') { sfxMagnet(); spawnEffect(sx, sy, '#d0a0ff', 30); spawnEffect(sx, sy, '#a060f0', 20); }
  }
  updateItemBar();
  updatePowerCounts();
  return true;
}

function curSpeed() {
  let spd = Math.max(SPD_MIN, SPD_INIT - ((snake ? snake.length : 3) - 3) * SPD_STEP);
  if (hasPower('slow')) spd *= 2;
  return spd;
}
function updSpeed() {}

function resetGame() {
  const c = CELL_COUNT >> 1;
  snake = [{x:c, y:c},{x:c-1, y:c},{x:c-2, y:c}];
  dir = RIGHT; nextDir = RIGHT; score = 0; gameOver = false; paused = false;
  food = spawnFood(); updScore();
}
function spawnFood() {
  while (true) {
    // 食物不出现在边界墙位置（留1格边距）
    const m = 1;
    const p = {x:m+Math.floor(Math.random()*(CELL_COUNT-2*m)), y:m+Math.floor(Math.random()*(CELL_COUNT-2*m))};
    if (!snake.some(s => s.x===p.x && s.y===p.y)) return p;
  }
}
function updScore() { scoreEl.textContent = 'SCORE:' + score; }

// ═══════════════ 更新 ═══════════════
function update() {
  if (state !== ST.PLAYING || gameOver || paused) return;
  const prevDir = dir;
  dir = nextDir;
  if (dir[0] !== prevDir[0] || dir[1] !== prevDir[1]) { try { sfxTurn(); } catch(e) {} }
  const h = snake[0];
  const nx = h.x + dir[0], ny = h.y + dir[1];

  // 无敌状态（屏障触发后 3 秒）
  const invincible = Date.now() < invincibleUntil;
  // 屏障激活中
  const shielded = hasPower('shield');

  if (nx < 0 || nx >= CELL_COUNT || ny < 0 || ny >= CELL_COUNT) {
    if (shielded || invincible) {
      if (shielded) { delete activePowers.shield; invincibleUntil = Date.now() + 3000; updateItemBar(); }
      return;
    }
    gameOver = true; startGameOverBgm(); return;
  }
  if (snake.some(s => s.x===nx && s.y===ny)) {
    if (shielded || invincible) {
      if (shielded) { delete activePowers.shield; invincibleUntil = Date.now() + 3000; updateItemBar(); }
      return;
    }
    gameOver = true; startGameOverBgm(); return;
  }

  // 磁铁效果
  if (hasPower('magnet') && food) {
    if (Math.abs(food.x-nx) > Math.abs(food.y-ny)) {
      food = { x: food.x + (food.x < nx ? 1 : -1), y: food.y };
    } else if (food.x !== nx || food.y !== ny) {
      food = { x: food.x, y: food.y + (food.y < ny ? 1 : -1) };
    }
  }

  snake.unshift({x:nx, y:ny});
  if (nx === food.x && ny === food.y) {
    const bonus = hasPower('double') ? 20 : 10;
    score += bonus; food = spawnFood(); updScore(); sfxEat();
  } else { snake.pop(); }

  // 清理过期能力
  for (const id of Object.keys(activePowers)) {
    if (Date.now() >= activePowers[id]) delete activePowers[id];
  }
  if (Date.now() >= invincibleUntil) invincibleUntil = 0;
  blinkOn = !blinkOn;
}

// ═══════════════ 像素绘制工具 ═══════════════
function pxRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
}

function pxBorder(x, y, w, h, color, thick) {
  thick = thick || 1;
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, thick);              // top
  ctx.fillRect(x, y+h-thick, w, thick);      // bottom
  ctx.fillRect(x, y, thick, h);              // left
  ctx.fillRect(x+w-thick, y, thick, h);      // right
}

/** 绘制像素字体 */
function pxText(text, x, y, size, color) {
  const s = size || 16;
  ctx.font = `bold ${s}px "Press Start 2P", monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color || P.TEXT;
  ctx.fillText(text, x, y);
}

// ═══════════════ 绘制：游戏画面 ═══════════════
function draw() {
  try {
    ctx.clearRect(0, 0, W, W);
    if (state === ST.MENU) drawMenu();
    else if (state === ST.SHOP) drawShop();
    else drawGame();
  } catch(e) {
    ctx.fillStyle = P.MENU_BG; ctx.fillRect(0, 0, W, W);
    pxText('ERROR', W/2, W/2, 12, '#ff4040');
  }
}

function drawGame() {
  // 草地地板（棋盘格浅绿）
  for (let y = 0; y < CELL_COUNT; y++) {
    for (let x = 0; x < CELL_COUNT; x++) {
      pxRect(x*CELL_SIZE, y*CELL_SIZE, CELL_SIZE, CELL_SIZE,
        (x+y)%2===0 ? P.FLOOR_A : P.FLOOR_B);
    }
  }

  // 装饰：随机花草石头（位置用坐标hash固定，不随帧变化）
  for (let y = 0; y < CELL_COUNT; y++) {
    for (let x = 0; x < CELL_COUNT; x++) {
      const h = (x*31 + y*17) % 100;
      const cx = x*CELL_SIZE+CELL_SIZE/2, cy = y*CELL_SIZE+CELL_SIZE/2;
      if (h < 4 && !snake.some(s=>s.x===x&&s.y===y) && !(food.x===x&&food.y===y)) {
        // 小花
        ctx.fillStyle = h<2 ? P.FLOWER : P.FLOWER2;
        ctx.fillRect(cx-2, cy-2, 4, 4);
        ctx.fillStyle = '#f0f8a0';
        ctx.fillRect(cx-1, cy-1, 2, 2);
      } else if (h >= 5 && h < 7) {
        // 小石头
        ctx.fillStyle = P.ROCK;
        ctx.fillRect(cx-3, cy-1, 6, 3);
        ctx.fillStyle = '#c8b8a8';
        ctx.fillRect(cx-1, cy-1, 3, 2);
      } else if (h >= 8 && h < 10) {
        // 草丛
        ctx.fillStyle = '#80c050';
        ctx.fillRect(cx-1, cy-2, 2, 4);
        ctx.fillStyle = '#a0e070';
        ctx.fillRect(cx, cy-3, 2, 5);
      }
    }
  }

  // 木栅栏边框
  const bw = CELL_SIZE * 0.4;
  for (let x = 0; x < CELL_COUNT; x++) {
    const odd = x % 2 === 0;
    pxRect(x*CELL_SIZE, 0, CELL_SIZE, bw + (odd?2:0), P.WALL);
    pxRect(x*CELL_SIZE, 0, CELL_SIZE, bw/2, P.WALL_IN);
  }
  const bY = W - bw;
  for (let x = 0; x < CELL_COUNT; x++) {
    const odd = x % 2 === 1;
    pxRect(x*CELL_SIZE, bY - (odd?2:0), CELL_SIZE, bw + (odd?2:0), P.WALL);
    pxRect(x*CELL_SIZE, bY + bw/2, CELL_SIZE, bw/2, P.WALL_IN);
  }
  for (let y = 0; y < CELL_COUNT; y++) {
    const odd = y % 2 === 0;
    pxRect(0, y*CELL_SIZE, bw + (odd?2:0), CELL_SIZE, P.WALL);
    pxRect(0, y*CELL_SIZE, bw/2, CELL_SIZE, P.WALL_IN);
  }
  const rX = W - bw;
  for (let y = 0; y < CELL_COUNT; y++) {
    const odd = y % 2 === 1;
    pxRect(rX - (odd?2:0), y*CELL_SIZE, bw + (odd?2:0), CELL_SIZE, P.WALL);
    pxRect(rX + bw/2, y*CELL_SIZE, bw/2, CELL_SIZE, P.WALL_IN);
  }

  // 食物 — 像素苹果
  const fx = food.x * CELL_SIZE, fy = food.y * CELL_SIZE;
  const fs = CELL_SIZE, fc = fs/2;

  // 光晕
  const grd = ctx.createRadialGradient(fx+fc, fy+fc, fc*0.2, fx+fc, fy+fc, fc*1.0);
  grd.addColorStop(0, P.FOOD_GLOW); grd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(fx-fc*0.3, fy-fc*0.3, fs+fc*0.6, fs+fc*0.6);

  const r = fs * 0.42;  // 苹果半径
  const ax = fx + fc, ay = fy + fc + 1;

  // 苹果主体（圆形像素化）
  ctx.fillStyle = '#801010';  // 暗边
  ctx.beginPath(); ctx.arc(ax, ay+1, r+1, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = P.FOOD;
  ctx.beginPath(); ctx.arc(ax, ay, r, 0, Math.PI*2); ctx.fill();
  // 高光
  ctx.fillStyle = P.FOOD_HL;
  ctx.beginPath(); ctx.arc(ax-r*0.2, ay-r*0.25, r*0.4, 0, Math.PI*2); ctx.fill();
  // 小高光
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(ax-r*0.15, ay-r*0.3, r*0.15, 0, Math.PI*2); ctx.fill();
  // 苹果底部凹痕
  ctx.fillStyle = '#b02020';
  ctx.beginPath(); ctx.arc(ax, ay+r*0.6, r*0.35, 0, Math.PI*2); ctx.fill();

  // 叶子
  const lx = ax + 2, ly = ay - r - 1;
  ctx.fillStyle = P.APPLE_GREEN;
  ctx.fillRect(lx-1, ly-3, 5, 6);
  ctx.fillStyle = P.APPLE_LEAF;
  ctx.fillRect(lx, ly-2, 3, 5);
  // 叶脉
  ctx.fillStyle = P.APPLE_GREEN;
  ctx.fillRect(lx+1, ly-1, 1, 4);

  // 茎
  ctx.fillStyle = '#604020';
  ctx.fillRect(ax, ly-2, 2, 4);

  // 屏障/无敌时蛇闪烁
  const blinking = (hasPower('shield') || Date.now() < invincibleUntil) && blinkOn;
  if (blinking) {
    // 闪烁：跳过本帧绘制蛇（画半透明替代）
    ctx.globalAlpha = 0.35;
  }

  // 蛇 — 连续身体厚线渲染（有机蛇形，非分段方块）
  const sz = CELL_SIZE;
  const hsz = sz/2;
  // 收集身体中心点
  const pts = snake.map(s => ({ x: s.x*sz+hsz, y: s.y*sz+hsz }));

  if (pts.length >= 2) {
    const bodyThick = sz * 0.68;

    // ── 第1层：深色轮廓粗线 ──
    ctx.strokeStyle = '#143810';
    ctx.lineWidth = bodyThick + 5;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();

    // ── 第2层：暗绿过渡 ──
    ctx.strokeStyle = '#1e5814';
    ctx.lineWidth = bodyThick + 2;
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();

    // ── 第3层：主体绿 ──
    ctx.strokeStyle = '#40b028';
    ctx.lineWidth = bodyThick;
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();

    // ── 第4层：亮面绿（上偏移细线） ──
    ctx.strokeStyle = '#70d850';
    ctx.lineWidth = bodyThick * 0.55;
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y - bodyThick*0.18);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y - bodyThick*0.18);
    ctx.stroke();

    // ── 第5层：高光白绿细线 ──
    ctx.strokeStyle = '#a0f878';
    ctx.lineWidth = bodyThick * 0.20;
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y - bodyThick*0.28);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y - bodyThick*0.28);
    ctx.stroke();

    // ── 腹部亮线 ──
    ctx.strokeStyle = 'rgba(200,255,180,0.18)';
    ctx.lineWidth = bodyThick * 0.22;
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y + bodyThick*0.2);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y + bodyThick*0.2);
    ctx.stroke();

    // ── 侧面暗边（两侧立体感） ──
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = bodyThick * 0.12;
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y + bodyThick*0.35);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y + bodyThick*0.35);
    ctx.stroke();

    // ── 菱形鳞片刻纹（V形/菱形图案沿身体排列） ──
    for (let i = 0; i < pts.length; i++) {
      const px = pts[i].x, py = pts[i].y;
      const b2 = bodyThick * 0.32;
      // V形暗纹（上排）
      ctx.fillStyle = 'rgba(0,0,0,0.10)';
      ctx.fillRect(px-1, py-b2*0.5, 2, 1);
      ctx.fillRect(px-3, py-b2*0.2, 6, 1);
      // 中心暗点
      ctx.fillStyle = 'rgba(0,0,0,0.07)';
      ctx.fillRect(px-1, py+b2*0.05, 3, 2);
      // 亮鳞片点
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(px-2, py-b2*0.35, 4, 1);
    }

    // ── 横向条纹（深色环带，间隔分布） ──
    for (let i = 0; i < pts.length; i += 5) {
      const px = pts[i].x, py = pts[i].y;
      ctx.fillStyle = 'rgba(0,0,0,0.13)';
      ctx.fillRect(px-bodyThick*0.35, py-2, bodyThick*0.7, 4);
      // 带边高光
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fillRect(px-bodyThick*0.35, py-3, bodyThick*0.7, 1);
    }

    // ── 腹部横纹 ──
    for (let i = 0; i < pts.length; i += 3) {
      const px = pts[i].x, py = pts[i].y;
      ctx.fillStyle = 'rgba(0,0,0,0.06)';
      ctx.fillRect(px-2, py+bodyThick*0.22, 4, 1);
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      ctx.fillRect(px-2, py+bodyThick*0.28, 4, 1);
    }

    // ── 顶部细高光 ──
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y - bodyThick*0.35);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y - bodyThick*0.35);
    ctx.stroke();
  }

  // ── 蛇尾（尖三角收尾） ──
  if (pts.length >= 2) {
    const tail = pts[pts.length-1], prev = pts[pts.length-2];
    let dx = tail.x - prev.x, dy = tail.y - prev.y;
    const len = Math.sqrt(dx*dx+dy*dy) || 1; dx /= len; dy /= len;
    const tipX = tail.x + dx*sz*0.5, tipY = tail.y + dy*sz*0.5;
    const hw = sz*0.32;
    // 轮廓
    ctx.fillStyle = '#143810';
    ctx.beginPath(); ctx.moveTo(tail.x-dy*hw, tail.y+dx*hw);
    ctx.lineTo(tail.x+dy*hw, tail.y-dx*hw);
    ctx.lineTo(tipX, tipY); ctx.closePath(); ctx.fill();
    // 填充
    ctx.fillStyle = '#2a7018';
    ctx.beginPath(); ctx.moveTo(tail.x-dy*hw*0.6, tail.y+dx*hw*0.6);
    ctx.lineTo(tail.x+dy*hw*0.6, tail.y-dx*hw*0.6);
    ctx.lineTo(tipX, tipY); ctx.closePath(); ctx.fill();
  }

  // ── 蛇头（椭圆大脑袋 + 眼睛 + 舌） ──
  if (pts.length >= 1) {
    const head = pts[0];
    let hdx = 0, hdy = 0;
    if (pts.length >= 2) { hdx = head.x-pts[1].x; hdy = head.y-pts[1].y; }
    else { hdx = dir[0]*sz; hdy = dir[1]*sz; }
    const hl = Math.sqrt(hdx*hdx+hdy*hdy) || 1;
    hdx /= hl; hdy /= hl;

    const hw = sz * 0.38, hh = sz * 0.34;
    const hcx = head.x + hdx*hw*0.4, hcy = head.y + hdy*hh*0.4;

    // 头轮廓
    ctx.fillStyle = '#143810';
    ctx.beginPath(); ctx.ellipse(hcx, hcy+1, hw+3, hh+3, 0, 0, Math.PI*2); ctx.fill();
    // 头阴影层
    ctx.fillStyle = '#1e5814';
    ctx.beginPath(); ctx.ellipse(hcx, hcy+1, hw+1, hh+1, 0, 0, Math.PI*2); ctx.fill();
    // 头主体
    ctx.fillStyle = '#48c030';
    ctx.beginPath(); ctx.ellipse(hcx, hcy, hw, hh, 0, 0, Math.PI*2); ctx.fill();
    // 头顶纹理横线（鳞片感）
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.fillRect(hcx-hw*0.4, hcy-hh*0.05, hw*0.8, 1);
    ctx.fillRect(hcx-hw*0.5, hcy+hh*0.15, hw*1.0, 1);
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fillRect(hcx-hw*0.3, hcy-hh*0.15, hw*0.6, 1);
    // 头高光（多层次）
    ctx.fillStyle = '#68e048';
    ctx.beginPath(); ctx.ellipse(hcx-hw*0.15, hcy-hh*0.22, hw*0.55, hh*0.48, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#90f868';
    ctx.beginPath(); ctx.ellipse(hcx-hw*0.22, hcy-hh*0.30, hw*0.38, hh*0.32, 0, 0, Math.PI*2); ctx.fill();
    // 鼻孔
    ctx.fillStyle = '#143810';
    ctx.fillRect(hcx+hdx*hw*0.6-1, hcy+hdy*hh*0.6-1, 2, 2);

    // 眼睛（锐利有神，不呆）
    const es = Math.max(4, Math.floor(sz*0.30));
    const eyOff = hw * 0.50;
    const perpX = -hdy, perpY = hdx;
    const e1x = hcx + perpX*eyOff - es/2;
    const e1y = hcy + perpY*eyOff - es/2;
    const e2x = hcx - perpX*eyOff - es/2;
    const e2y = hcy - perpY*eyOff - es/2;

    // 眉骨（上眼眶凸起，让表情更凶/更锐利）
    ctx.fillStyle = '#0d2a08';
    ctx.fillRect(e1x-1, e1y-2, es+2, 2);
    ctx.fillRect(e2x-1, e2y-2, es+2, 2);
    ctx.fillStyle = '#60e040';
    ctx.fillRect(e1x-1, e1y-3, es+2, 1);
    ctx.fillRect(e2x-1, e2y-3, es+2, 1);

    // 眼眶
    ctx.fillStyle = '#143810';
    ctx.fillRect(e1x-1, e1y-1, es+2, es+2);
    ctx.fillRect(e2x-1, e2y-1, es+2, es+2);
    // 眼白
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(e1x, e1y, es, es);
    ctx.fillRect(e2x, e2y, es, es);
    // 虹膜（金色锐利）
    ctx.fillStyle = '#f0c830';
    ctx.fillRect(e1x+1, e1y+1, es-2, es-2);
    ctx.fillRect(e2x+1, e2y+1, es-2, es-2);
    // 竖瞳
    ctx.fillStyle = '#000000';
    ctx.fillRect(e1x+es-2+hdx, e1y+1, 2, es-2);
    ctx.fillRect(e2x+es-2+hdx, e2y+1, 2, es-2);
    // 瞳孔高光
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(e1x+es-2+hdx, e1y, 1, 1);
    ctx.fillRect(e2x+es-2+hdx, e2y, 1, 1);

    // 嘴角线（微带笑意/凶意）
    ctx.fillStyle = '#143810';
    ctx.fillRect(hcx+perpX*hw*0.35-2, hcy+perpY*hw*0.35+hh*0.2, 5, 1);

    // 蛇舌
    const tongueLen = sz * 0.50;
    const txBase = hcx + hdx*hw*0.9;
    const tyBase = hcy + hdy*hh*0.9;
    const txTip = hcx + hdx*(hw+tongueLen);
    const tyTip = hcy + hdy*(hh+tongueLen);
    ctx.strokeStyle = '#c82828';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(txBase, tyBase);
    ctx.lineTo(txTip, tyTip);
    ctx.stroke();
    // 舌尖分叉
    ctx.fillStyle = '#c82828';
    ctx.fillRect(txTip+perpX*2-1, tyTip+perpY*2, 2, 3);
    ctx.fillRect(txTip-perpX*2-1, tyTip-perpY*2, 2, 3);
  }

  ctx.globalAlpha = 1;

  // ── 屏障蓝光覆盖 ──
  if (hasPower('shield')) {
    const pts2 = snake.map(s => ({x:s.x*CELL_SIZE+CELL_SIZE/2, y:s.y*CELL_SIZE+CELL_SIZE/2}));
    if (pts2.length >= 2) {
      ctx.strokeStyle = 'rgba(60,120,220,0.45)'; ctx.lineWidth = CELL_SIZE*0.70; ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.beginPath(); ctx.moveTo(pts2[0].x, pts2[0].y);
      for (let i=1;i<pts2.length;i++) ctx.lineTo(pts2[i].x, pts2[i].y);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(120,180,255,0.30)'; ctx.lineWidth = CELL_SIZE*0.45;
      ctx.beginPath(); ctx.moveTo(pts2[0].x, pts2[0].y);
      for (let i=1;i<pts2.length;i++) ctx.lineTo(pts2[i].x, pts2[i].y);
      ctx.stroke();
    }
  }

  // ── 粒子特效 ──
  updateEffects();

  // ── 能力激活指示器（右上角，支持叠加显示） ──
  let pY = 4;
  for (const item of SHOP_ITEMS) {
    if (hasPower(item.id)) {
      const remain = Math.max(0, Math.ceil((activePowers[item.id] - Date.now())/1000));
      const label = item.id==='shield' ? `${item.icon} ON` : `${item.icon} ${remain}s`;
      const lw = Math.max(70, label.length*7+14);
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.fillRect(W-lw-4, pY, lw, 18);
      pxBorder(W-lw-4, pY, lw, 18, '#c0a040', 1);
      ctx.fillStyle = '#f0c060';
      ctx.font = `bold ${Math.floor(W*0.018)}px "Press Start 2P", monospace`;
      ctx.textAlign = 'right';
      ctx.fillText(label, W-8, pY+12);
      pY += 20;
    }
  }
  if (Date.now() < invincibleUntil) {
    const remain = Math.max(0, Math.ceil((invincibleUntil - Date.now())/1000));
    const label = `🛡️ 无敌 ${remain}s`;
    const lw = Math.max(90, label.length*7+14);
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(W-lw-4, pY, lw, 18);
    pxBorder(W-lw-4, pY, lw, 18, '#60c0ff', 1);
    ctx.fillStyle = '#60c0ff';
    ctx.font = `bold ${Math.floor(W*0.018)}px "Press Start 2P", monospace`;
    ctx.textAlign = 'right';
    ctx.fillText(label, W-8, pY+12);
  }

  // ── 暂停按钮（左上角） ──
  if (!gameOver) {
    const px=4, py=4, pw=28, ph=28;
    const cx=px+pw/2, cy=py+ph/2;
    ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(px,py,pw,ph);
    ctx.strokeStyle='rgba(200,180,150,0.5)'; ctx.lineWidth=1.5; ctx.strokeRect(px,py,pw,ph);
    ctx.fillStyle='#f0e8d0';
    if (paused) { ctx.beginPath(); ctx.moveTo(cx-3,cy-5); ctx.lineTo(cx-3,cy+5); ctx.lineTo(cx+5,cy); ctx.closePath(); ctx.fill(); }
    else { const bw2=3,bh2=12,g=2; ctx.fillRect(cx-g/2-bw2,cy-bh2/2,bw2,bh2); ctx.fillRect(cx+g/2,cy-bh2/2,bw2,bh2); }
  }


  // 遮罩
  if (gameOver) {
    const earned = Math.floor(score / 5);
    drawOv('游 戏 结 束','#ff6040','得分:'+score+' (+'+earned+'金币)','点击任意位置返回菜单');
  } else if (paused) drawOv('已 暂 停','#6a8a30','点击任意位置继续','');
}

// ═══════════════ 绘制：主菜单 ═══════════════
function drawMenu() {
  menuFrame++;

  // 温暖木色地板
  for (let y = 0; y < CELL_COUNT; y++) {
    for (let x = 0; x < CELL_COUNT; x++) {
      pxRect(x*CELL_SIZE, y*CELL_SIZE, CELL_SIZE, CELL_SIZE,
        (x+y)%2===0 ? '#d8c8a8' : '#ccbc9c');
    }
  }

  // 四周木栅栏
  const bw = CELL_SIZE * 0.4;
  for (let x = 0; x < CELL_COUNT; x++) {
    pxRect(x*CELL_SIZE, 0, CELL_SIZE, bw+(x%2===0?2:0), P.WALL);
    pxRect(x*CELL_SIZE, W-bw-(x%2===1?2:0), CELL_SIZE, bw+(x%2===1?2:0), P.WALL);
  }
  for (let y = 0; y < CELL_COUNT; y++) {
    pxRect(0, y*CELL_SIZE, bw+(y%2===0?2:0), CELL_SIZE, P.WALL);
    pxRect(W-bw-(y%2===1?2:0), y*CELL_SIZE, bw+(y%2===1?2:0), CELL_SIZE, P.WALL);
  }

  // 均匀散布装饰
  for (var i = 0; i < 24; i++) {
    var cx = ((i*137+53)%(CELL_COUNT-2)+1)*CELL_SIZE + CELL_SIZE/2;
    var cy = ((i*211+97)%(CELL_COUNT-3)+2)*CELL_SIZE + CELL_SIZE/2;
    if (Math.abs(cx-W/2)<W*0.28 && cy>W*0.42 && cy<W*0.80) continue;
    var t = (i*73)%6;
    if (t === 0) {
      ctx.fillStyle = ['#f080a0','#f0c040','#f0a0c0','#ff8080'][i%4];
      ctx.fillRect(cx-3, cy-4, 6, 6);
      ctx.fillStyle = '#ffffc0'; ctx.fillRect(cx-1, cy-3, 3, 3);
    } else if (t === 1) {
      ctx.fillStyle = '#80c050'; ctx.fillRect(cx-1, cy-3, 2, 6);
      ctx.fillStyle = '#a0e070'; ctx.fillRect(cx, cy-4, 2, 7);
      ctx.fillStyle = '#60a030'; ctx.fillRect(cx-2, cy, 5, 2);
    } else if (t === 2) {
      ctx.fillStyle = ['#c0b0a0','#b0a8c0','#a0b0b0'][i%3];
      ctx.fillRect(cx-3, cy-1, 6, 3);
      ctx.fillStyle = '#d8d0c8'; ctx.fillRect(cx-1, cy-1, 3, 2);
    } else if (t === 3) {
      ctx.fillStyle = ['#f05040','#f0a030','#f040a0','#e0e040'][i%4];
      ctx.fillRect(cx+2, cy-1, 6, 5);
      ctx.fillStyle = '#fff'; ctx.fillRect(cx+3, cy-1, 2, 2);
      ctx.fillStyle = '#e0c8b0'; ctx.fillRect(cx+4, cy+3, 2, 3);
    } else if (t === 4) {
      ctx.fillStyle = '#6090c0'; ctx.fillRect(cx-5, cy-2, 10, 5);
      ctx.fillStyle = '#80b8e0'; ctx.fillRect(cx-3, cy-1, 6, 3);
    } else {
      ctx.fillStyle = ['#e0a040','#c08030','#d09020'][i%3];
      ctx.fillRect(cx-2, cy-1, 4, 2);
    }
  }

  // 飘动蝴蝶（6只，上下都有）
  for (var bi=0; bi<6; bi++) {
    var bfx = W*(0.15+bi*0.13) + Math.sin(menuFrame*0.04+bi)*W*0.07;
    var bfy = (bi<3 ? W*0.24 : W*0.78) + Math.cos(menuFrame*0.06+bi)*W*0.05;
    var bc = ['#f080c0','#f0a060','#f060a0','#c080f0','#f08080','#e0a0c0'][bi];
    ctx.fillStyle = bc; ctx.fillRect(bfx-4, bfy-3, 4, 3); ctx.fillRect(bfx+2, bfy-3, 4, 3);
    ctx.fillStyle = '#a04080'; ctx.fillRect(bfx-1, bfy, 4, 2);
  }

  // 火把装饰（左右两侧）
  const torchX = [bw + 4, W - bw - 8];
  for (const tx of torchX) {
    const flicker = Math.sin(menuFrame * 0.15 + tx) * 0.3 + 0.7;
    // 火把柄
    pxRect(tx, W*0.58, 4, 14, '#6a5a3a');
    // 火焰
    const flameR = Math.floor(8 + flicker * 4);
    const flameG = Math.floor(120 + flicker * 80);
    const flameB = Math.floor(20);
    const flC = `rgb(255,${flameG},${flameB})`;
    const glow = ctx.createRadialGradient(tx+2, W*0.54, 0, tx+2, W*0.54, flameR*2);
    glow.addColorStop(0, `rgba(255,${flameG},20,0.7)`);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(tx-flameR*2, W*0.54-flameR*2, flameR*4, flameR*4);
    ctx.fillStyle = flC;
    ctx.fillRect(tx, W*0.5, 4, 12);
    ctx.fillStyle = '#ffff80';
    ctx.fillRect(tx+1, W*0.48, 2, 6);
  }

  // 标题横幅背景
  const bannerW = W * 0.74, bannerH = W * 0.18;
  const bx = W/2 - bannerW/2, by = W * 0.12;
  ctx.fillStyle = '#c8b898';
  ctx.fillRect(bx-3, by-3, bannerW+6, bannerH+6);
  pxBorder(bx-3, by-3, bannerW+6, bannerH+6, P.WALL, 2);
  ctx.fillStyle = '#f0e8d0';
  ctx.fillRect(bx, by, bannerW, bannerH);
  pxBorder(bx, by, bannerW, bannerH, '#6a4a2a', 1);

  // 标题文字（带柔和阴影的精致标题）
  const pulse = (Math.sin(menuFrame * 0.06) + 1) / 2;
  const tr = Math.floor(60 + pulse * 35), tg = Math.floor(120 + pulse * 30);
  const titleColor = `rgb(${tr},${tg},15)`;
  // 柔和描边阴影
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  ctx.font = `bold ${Math.floor(W*0.054)}px "Press Start 2P", monospace`;
  ctx.textAlign = 'center';
  ctx.fillText('PIXEL SNAKE', W/2+1, by + bannerH*0.28+1);
  ctx.fillStyle = titleColor;
  ctx.fillText('PIXEL SNAKE', W/2, by + bannerH*0.28);
  // 副标题
  ctx.fillStyle = '#8a6a4a';
  ctx.font = `bold ${Math.floor(W*0.044)}px "Microsoft YaHei", sans-serif`;
  ctx.fillText('贪 吃 蛇', W/2+1, by + bannerH*0.74+1);
  ctx.fillStyle = '#6a4a2a';
  ctx.fillText('贪 吃 蛇', W/2, by + bannerH*0.74);

  // 开始按钮
  const btnW = W * 0.52, btnH = W * 0.10;
  const btnX = W/2 - btnW/2, btnY = W * 0.44;
  btnRect = {x:btnX, y:btnY, w:btnW, h:btnH};

  const btnBg = btnHover ? P.BTN_HI : P.BTN;
  ctx.fillStyle = '#000';
  ctx.fillRect(btnX+3, btnY+3, btnW, btnH);
  ctx.fillStyle = btnBg;
  ctx.fillRect(btnX, btnY, btnW, btnH);
  pxBorder(btnX, btnY, btnW, btnH, btnHover ? '#c0a060' : P.BTN_BRD, 2);

  const btnText = btnHover ? '> 开始游戏 <' : '  开始游戏  ';
  pxText(btnText, W/2, btnY + btnH/2, W*0.032, btnHover ? '#5a3a1a' : '#6a4a2a');

  // 商店按钮
  const shopBtnW = W*0.35, shopBtnH = W*0.075;
  const shopBtnX = W/2 - shopBtnW/2, shopBtnY = btnY + btnH + W*0.04;
  shopBtnRect = {x:shopBtnX, y:shopBtnY, w:shopBtnW, h:shopBtnH};
  const onShop = btnHoverShop;
  ctx.fillStyle = onShop ? P.BTN_HI : P.BTN;
  ctx.fillRect(shopBtnX, shopBtnY, shopBtnW, shopBtnH);
  pxBorder(shopBtnX, shopBtnY, shopBtnW, shopBtnH, onShop ? '#c0a060' : P.BTN_BRD, 1);
  pxText(onShop ? '> 商店 <' : '  商店  ', W/2, shopBtnY + shopBtnH/2, W*0.028, onShop ? '#5a3a1a' : '#6a4a2a');

  // 金币（大图标 + 数字）
  const coinYY = shopBtnY + shopBtnH + W*0.04;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#4a2a10';
  ctx.font='18px "Press Start 2P", monospace';
  ctx.fillText('💰', W/2 - W*0.04, coinYY);
  ctx.font='13px "Press Start 2P", monospace';
  ctx.fillText(totalCoins, W/2 + W*0.04, coinYY + 5)

  // 操作说明 — 居中排版
  ctx.fillStyle = '#8a7a6a';
  ctx.font = `bold ${Math.floor(W*0.020)}px "Microsoft YaHei", sans-serif`;
  ctx.textAlign = 'center';
  const hyBase = coinYY + W*0.10;
  ctx.fillText('— 游戏开始后 —', W/2, hyBase - W*0.030);
  const hints = [
    {k:'点击方向按钮', v:'移 动'},
    {k:'点击道具图标', v:'使用道具'},
  ];
  hints.forEach((h, i) => {
    const yy = hyBase + i*W*0.040;
    const txt = h.k + '  —  ' + h.v;
    ctx.fillStyle = '#7a6a5a';
    ctx.font = `bold ${Math.floor(W*0.022)}px "Microsoft YaHei", sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(txt, W/2, yy);
  });

  // 底部装饰花草
  const decoY = hyBase + hints.length * W*0.040 + W*0.04;
}


// ═══════════════ 商店界面 ═══════════════
let shopItemRects = [];

function drawShop() {
  // 温暖木地板
  for (let y=0;y<CELL_COUNT;y++) for (let x=0;x<CELL_COUNT;x++)
    pxRect(x*CELL_SIZE,y*CELL_SIZE,CELL_SIZE,CELL_SIZE,(x+y)%2===0?'#d8c8a8':'#ccbc9c');

  // 四边木栅栏
  const bw2=CELL_SIZE*0.4;
  for (let x=0;x<CELL_COUNT;x++) {pxRect(x*CELL_SIZE,0,CELL_SIZE,bw2+(x%2===0?2:0),P.WALL);pxRect(x*CELL_SIZE,W-bw2-(x%2===1?2:0),CELL_SIZE,bw2+(x%2===1?2:0),P.WALL);}
  for (let y=0;y<CELL_COUNT;y++) {pxRect(0,y*CELL_SIZE,bw2+(y%2===0?2:0),CELL_SIZE,P.WALL);pxRect(W-bw2-(y%2===1?2:0),y*CELL_SIZE,bw2+(y%2===1?2:0),CELL_SIZE,P.WALL);}

  // 标题
  const bannerW2=W*0.58,bannerH2=W*0.12;
  const bx2=W/2-bannerW2/2,by2=W*0.06;
  ctx.fillStyle='#d8c8a8';ctx.fillRect(bx2-2,by2-2,bannerW2+4,bannerH2+4);
  pxBorder(bx2-2,by2-2,bannerW2+4,bannerH2+4,P.WALL,2);
  ctx.fillStyle='#f0e8d0';ctx.fillRect(bx2,by2,bannerW2,bannerH2);
  pxBorder(bx2,by2,bannerW2,bannerH2,'#6a4a2a',1);
  pxText('商 店',W/2,by2+bannerH2*0.32,W*0.045,'#5a3a1a');
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#4a2a10';
  ctx.font='18px "Press Start 2P", monospace';ctx.fillText('💰',W/2-W*0.04,by2+bannerH2*0.72);
  ctx.font='13px "Press Start 2P", monospace';ctx.fillText(totalCoins,W/2+W*0.04,by2+bannerH2*0.72+5);

  // 道具列表
  shopItemRects = [];
  const itemStartY = W*0.22, itemH = W*0.15, gap = W*0.018;
  SHOP_ITEMS.forEach((item, i) => {
    const iy = itemStartY + i*(itemH+gap);
    const ix = W*0.08, iw = W*0.84;

    // 背景
    ctx.fillStyle = (inventory[item.id]>=item.max)?'#e0d8c8':'#f0e8d0';
    ctx.fillRect(ix, iy, iw, itemH);
    pxBorder(ix, iy, iw, itemH, P.WALL, 1);

    // 图标+名称
    pxText(item.icon+' '+item.name, ix+iw*0.22, iy+itemH*0.30, W*0.032, '#4a2a10');
    // 描述
    pxText(item.desc, ix+iw*0.22, iy+itemH*0.62, W*0.022, '#6a5a4a');
    // 价格&库存
    const owned = inventory[item.id];
    const maxed = owned >= item.max;
    pxText(maxed?'已满':('💰'+item.cost), ix+iw*0.75, iy+itemH*0.30, W*0.028, maxed?'#608060':'#6a3a10');
    pxText('拥有:'+owned+'/'+item.max, ix+iw*0.75, iy+itemH*0.62, W*0.020, '#6a5a4a');

    shopItemRects.push({x:ix, y:iy, w:iw, h:itemH, id:item.id});
  });

  // 返回按钮
  const backBtnW=W*0.32,backBtnH=W*0.065;
  const backX=W/2-backBtnW/2,backY=W*0.90;
  ctx.fillStyle=P.BTN;ctx.fillRect(backX,backY,backBtnW,backBtnH);
  pxBorder(backX,backY,backBtnW,backBtnH,P.BTN_BRD,1);
  pxText('返 回',W/2,backY+backBtnH/2,W*0.028,'#5a3a1a');
  shopItemRects.push({x:backX,y:backY,w:backBtnW,h:backBtnH,id:'back'});

}

function handleShopClick(mx, my) {
  console.log('shop tap:',mx,my,'rects:',JSON.stringify(shopItemRects));
  for (const r of shopItemRects) {
    if (mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h) {
      if (r.id==='back') { sfxClick(); state=ST.MENU; return; }
      buyItem(r.id);
      return;
    }
  }
}

// ═══════════════ 覆盖层 ═══════════════
function drawOv(title, tc, l1, l2) {
  // 半透明遮罩
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, W);

  // 中央面板
  const pw = W*0.78, ph = W*0.22;
  const px = W/2-pw/2, py = W/2-ph/2;
  ctx.fillStyle = '#faf5e8';
  ctx.fillRect(px, py, pw, ph);
  // 双线边框
  ctx.strokeStyle = tc; ctx.lineWidth = 3;
  ctx.strokeRect(px, py, pw, ph);
  ctx.strokeStyle = '#c8b898'; ctx.lineWidth = 1;
  ctx.strokeRect(px+4, py+4, pw-8, ph-8);

  // 标题
  ctx.fillStyle = tc;
  ctx.font = `bold ${Math.floor(W*0.050)}px "Microsoft YaHei", sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(title, W/2+1, py+ph*0.28+1);
  ctx.fillStyle = '#4a2020';
  ctx.fillText(title, W/2, py+ph*0.28);

  // 得分行
  if (l1) {
    ctx.fillStyle = '#5a3a1a';
    ctx.font = `bold ${Math.floor(W*0.036)}px "Press Start 2P", monospace`;
    ctx.fillText(l1, W/2, py+ph*0.58);
  }
  // 提示行
  if (l2) {
    ctx.fillStyle = '#8a7a6a';
    ctx.font = `${Math.floor(W*0.026)}px "Microsoft YaHei", sans-serif`;
    ctx.fillText(l2, W/2, py+ph*0.82);
  }
}

// ═══════════════ 输入处理 ═══════════════
function setDir(dx, dy) {
  if (state !== ST.PLAYING || gameOver || paused) return;
  var changed = false;
  if (dx===0 && dy===-1 && dir!==DOWN) { nextDir=UP; changed=true; }
  else if (dx===0 && dy===1 && dir!==UP) { nextDir=DOWN; changed=true; }
  else if (dx===-1 && dy===0 && dir!==RIGHT) { nextDir=LEFT; changed=true; }
  else if (dx===1 && dy===0 && dir!==LEFT) { nextDir=RIGHT; changed=true; }
  if (changed) { try { sfxTurn(); } catch(e) {} }
}

document.addEventListener('keydown', e => {
  initAudio();
  const k = e.key;
  if (state === ST.MENU) {
    if (k === 'Enter' || k === ' ') { e.preventDefault(); startGame(); }
    if (k === 's' || k === 'S') { e.preventDefault(); state = ST.SHOP; }
    return;
  }
  if (state === ST.SHOP) {
    if (k === 'Escape' || k === 'Backspace' || k === 's' || k === 'S') { e.preventDefault(); state = ST.MENU; }
    return;
  }
  if (gameOver) {
    if (k === 'r' || k === 'R') { e.preventDefault(); goToMenu(); }
    return;
  }
  if (k === 'ArrowUp'||k==='w'||k==='W'){e.preventDefault();if(dir!==DOWN)nextDir=UP;}
  else if(k==='ArrowDown'||k==='s'||k==='S'){e.preventDefault();if(dir!==UP)nextDir=DOWN;}
  else if(k==='ArrowLeft'||k==='a'||k==='A'){e.preventDefault();if(dir!==RIGHT)nextDir=LEFT;}
  else if(k==='ArrowRight'||k==='d'||k==='D'){e.preventDefault();if(dir!==LEFT)nextDir=RIGHT;}
  else if(k===' '){e.preventDefault();paused=!paused;}
  else if(k==='r'||k==='R'){e.preventDefault();goToMenu();}
  else if(k==='1'){e.preventDefault();usePower('shield');}
  else if(k==='2'){e.preventDefault();usePower('double');}
  else if(k==='3'){e.preventDefault();usePower('slow');}
  else if(k==='4'){e.preventDefault();usePower('magnet');}
});

cv.addEventListener('click', e => {
  initAudio();
  // 暂停时点击任意位置继续
  if (state===ST.PLAYING && paused && !gameOver) { paused = false; return; }
  // 游戏结束点击任意位置返回菜单
  if (state===ST.PLAYING && gameOver) { goToMenu(); return; }
  const r=cv.getBoundingClientRect(), s=W/r.width;
  const mx=(e.clientX-r.left)*s, my=(e.clientY-r.top)*s;

  if (state===ST.MENU) {
    if (btnRect && mx>=btnRect.x&&mx<=btnRect.x+btnRect.w&&my>=btnRect.y&&my<=btnRect.y+btnRect.h) startGame();
    else if (shopBtnRect && mx>=shopBtnRect.x&&mx<=shopBtnRect.x+shopBtnRect.w&&my>=shopBtnRect.y&&my<=shopBtnRect.y+shopBtnRect.h) { sfxClick(); state=ST.SHOP; }
  } else if (state===ST.SHOP) {
    handleShopClick(mx, my);
  } else if (state===ST.PLAYING) {
    if (gameOver) { goToMenu(); return; }
    if (mx>=4&&mx<=32&&my>=4&&my<=32) { paused=!paused; return; }
  }
});
cv.addEventListener('mousemove', e => {
  const r=cv.getBoundingClientRect(), s=W/r.width;
  const mx=(e.clientX-r.left)*s, my=(e.clientY-r.top)*s;

  if (state===ST.MENU) {
    if (btnRect) btnHover=(mx>=btnRect.x&&mx<=btnRect.x+btnRect.w&&my>=btnRect.y&&my<=btnRect.y+btnRect.h);
    if (shopBtnRect) btnHoverShop=(mx>=shopBtnRect.x&&mx<=shopBtnRect.x+shopBtnRect.w&&my>=shopBtnRect.y&&my<=shopBtnRect.y+shopBtnRect.h);
  } else { btnHover=false; btnHoverShop=false; }
});

let tsX=0, tsY=0;
cv.addEventListener('touchstart', e => {
  initAudio(); tsX=e.touches[0].clientX; tsY=e.touches[0].clientY; e.preventDefault();
}, {passive:false});
cv.addEventListener('touchmove', e => e.preventDefault(), {passive:false});
cv.addEventListener('touchend', e => {
  if (state===ST.PLAYING && paused && !gameOver) { paused = false; return; }
  if (state===ST.PLAYING && gameOver) { goToMenu(); return; }
  const t=e.changedTouches[0], dx=t.clientX-tsX, dy=t.clientY-tsY;
  if (Math.abs(dx)<20&&Math.abs(dy)<20) {
    if (state===ST.SHOP) { var sr=cv.getBoundingClientRect(), ss=W/sr.width; handleShopClick((t.clientX-sr.left)*ss,(t.clientY-sr.top)*ss); return; }
    if (state===ST.MENU) {
      const r=cv.getBoundingClientRect(), s=W/r.width;
      var mx=(t.clientX-r.left)*s, my=(t.clientY-r.top)*s;
      if (btnRect && mx>=btnRect.x&&mx<=btnRect.x+btnRect.w&&my>=btnRect.y&&my<=btnRect.y+btnRect.h) { startGame(); return; }
      if (shopBtnRect && mx>=shopBtnRect.x&&mx<=shopBtnRect.x+shopBtnRect.w&&my>=shopBtnRect.y&&my<=shopBtnRect.y+shopBtnRect.h) { sfxClick(); state=ST.SHOP; return; }
    } return;
  }
  if (Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1,0); else setDir(0,dy>0?1:-1);
});

function startGame() {
  initAudio();
  sfxClick();
  state = ST.PLAYING;
  resetGame();
  showControls();
  updateItemBar();

  startBgm('game');
}

function goToMenu() {
  // 结算金币（得分/5）
  if (score > 0 && gameOver) {
    var bonus = hasPower('double') ? 2 : 1;
    totalCoins += Math.floor(score / 5) * bonus;
    saveData();
  }
  state = ST.MENU;
  gameOver = false;
  paused = false;
  snake = null;
  activePowers = {};
  invincibleUntil = 0;
  hideControls();
  updateItemBar();

  speedEl.textContent = '';
  if (_goTimer) { clearTimeout(_goTimer); _goTimer = null; }
  bgmType = '';
  try { stopBgm(); } catch(e) {}
}

// 首次交互启动菜单音乐
let _firstInteraction = false;
const _origInitAudio = initAudio;
initAudio = function() {
  _origInitAudio();
  _firstInteraction = true;
};

// ═══════════════ 主循环 ═══════════════
function tick() {
  try { update(); } catch(e) {}
  try { draw(); } catch(e) {}
  try { updateItemBar(); } catch(e) {}
  setTimeout(tick, state === ST.MENU ? 50 : curSpeed());
}
tick();

// 注册 PWA Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
